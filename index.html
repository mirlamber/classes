<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constitutions des classes V13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Répartition des classes</h1>


<div class="toolbar">

    <div class="file-wrapper">

        <input type="file" id="loadFile" hidden>

        <button id="fileBtn">📁 Choisir un fichier</button>

    </div>

    <button id="mergeBtn">
        Fusionner les retours
    </button>

    <input
        type="file"
        id="mergeFiles"
        accept=".json"
        multiple
        hidden
    >

    <button id="saveBtn">💾 Sauvegarder</button>

    <button id="pdfBtn">📄 Export PDF</button>
    <button id="csvBtn">Export tableur</button>
    <button id="adminBtn">⚙️ Admin</button>

    <div id="adminModal" class="modal" style="display:none;">
        <div class="modal-content">

            <h2>Admin</h2>

            <textarea id="adminInput"
            placeholder="Nom    Prénom    Sexe"></textarea>

            <button id="adminImportBtn">Importer CSV</button>
            <button id="adminCloseBtn">Fermer</button>

        </div>
    </div>
</div>

<div class="config-bar">

    <label>Nombre de classes :</label>

    <select id="nbClasses">
        <option value="4" selected>4</option>
        <option value="5" >5</option>
        <option value="6">6</option>
    </select>

    <button id="buildBtn">
        Créer les classes
    </button>

</div>



<!-- NON AFFECTÉS -->

<div class="column">
    <div class="add-student-mini">
        <div class="add-student-header">
            Ajout rapide
        </div>

        <input type="text" id="newPrenom" placeholder="Prénom">

        <input type="text" id="newNom" placeholder="Nom">

        <select id="newSexe">
            <option value="F">F</option>
            <option value="G">G</option>
        </select>

        <select id="newClasseOrigine"></select>

        <button id="addStudentBtn">➕</button>

        <div class="trash-zone" id="trash">

            🗑️ 

        </div>

    </div>
    <h2>
        Non affectés
        <span id="pool-count"></span>
        <span class="hint"> (clic droit sur l'élève pour options)</span>
    </h2>

    
    <div
        id="poolBoard"
        class="pool-board dynamic">
    </div>

    <div class="legend" id="legend">
        <div class="legend-item">
            <span class="dot">🟡</span>
            <span class="label">Difficultés</span>
            <span class="count" id="count-difficulte">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🔴</span>
            <span class="label">Comportement</span>
            <span class="count" id="count-comportement">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🔵</span>
            <span class="label">Accompagnement</span>
            <span class="count" id="count-accompagnement">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🟢</span>
            <span class="label">Excellent</span>
            <span class="count" id="count-excellent">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🟣</span>
            <span class="label">Allemand</span>
            <span class="count" id="count-allemand">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🚫</span>
            <span class="label">Très absent</span>
            <span class="count" id="count-absent">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🟤</span>
            <span class="label">Latin</span>
            <span class="count" id="count-latin">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🏃</span>
            <span class="label">Sport</span>
            <span class="count" id="count-sport">0</span>
        </div>

        <div class="legend-item">
            <span class="dot">🟠</span>
            <span class="label">LCE</span>
            <span class="count" id="count-lce">0</span>
        </div>


        <div class="search-bar">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Rechercher un élève..."
            >
        </div>
    </div>


</div>

<!-- CLASSES -->

<div
    id="classesBoard"
    class="classes-board">
</div>


<!-- MENU CONTEXTUEL -->

<div id="contextMenu" class="context-menu">

    <label>
        <input type="checkbox" id="ctx-difficulte">
        🟡 Difficultés
    </label>

    <label>
        <input type="checkbox" id="ctx-comportement">
        🔴 Comportement
    </label>

    <label>
        <input type="checkbox" id="ctx-accompagnement">
        🔵 Accompagnement
    </label>

    <label>
        <input type="checkbox" id="ctx-excellent">
        🟢 Excellent niveau
    </label>

    <label>
        <input type="checkbox" id="ctx-allemand">
        🟣 Allemand
    </label>

    <label>
        <input type="checkbox" id="ctx-latin">
        🟤 Latin
    </label>

    <label>
        <input type="checkbox" id="ctx-sport">
        🏃 Sport
    </label>

    <label>
        <input type="checkbox" id="ctx-lfe">
        🟠 LCE
    </label>

    <label>
        <input type="checkbox" id="ctx-absent">
        🚫 Très absent
    </label>
</div>


<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>


</body>
</html>
